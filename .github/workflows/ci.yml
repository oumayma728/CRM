name: CI Pipeline

"on":
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Backend
        run: dotnet restore Backend/CrmApi.sln

      - name: Build main project
        run: dotnet build Backend/src/CrmApi/CrmApi.csproj --configuration Release --no-restore

      - name: Build test project
        run: dotnet build Backend/tests/CrmApi.Tests/CrmApi.Tests.csproj --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test Backend/tests/CrmApi.Tests/CrmApi.Tests.csproj --configuration Release --no-build --verbosity minimal

      - name: Collect Code Coverage
        run: dotnet test Backend/tests/CrmApi.Tests/CrmApi.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --settings Backend/coverlet.runsettings

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: Backend/tests/CrmApi.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run Unit Tests
        run: npx vitest run --coverage

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pfe_crm_ia
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Restore & build backend
        working-directory: ./Backend
        run: |
          dotnet restore CrmApi.sln
          dotnet build src/CrmApi/CrmApi.csproj --configuration Release --no-restore

      - name: Start backend
        working-directory: ./Backend/src/CrmApi
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=pfe_crm_ia;Username=postgres;Password=postgres"
          ASPNETCORE_URLS: "http://0.0.0.0:5190"
        run: |
          nohup dotnet run --configuration Release --no-build --project CrmApi.csproj > /tmp/backend.log 2>&1 &
          echo "Backend PID: $!"
          for i in $(seq 1 60); do
            if curl -s http://localhost:5190/api/health > /dev/null 2>&1; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 2
          done
          echo "Backend failed to start. Logs:"
          cat /tmp/backend.log
          exit 1

      - name: Start frontend
        working-directory: ./frontend
        run: |
          nohup npm run dev -- --host 0.0.0.0 > /tmp/frontend.log 2>&1 &
          echo "Frontend PID: $!"
          for i in $(seq 1 30); do
            if curl -s http://localhost:5173 > /dev/null 2>&1; then
              echo "Frontend is ready!"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "Frontend failed to start. Logs:"
          cat /tmp/frontend.log
          exit 1

      - name: Run Playwright tests
        working-directory: ./frontend
        run: |
          if [ -d "e2e" ] && [ "$(ls -A e2e/ 2>/dev/null)" ]; then
            npx playwright test
          else
            echo "No e2e tests found. Skipping."
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: warn

      - name: Upload backend logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/backend.log
          if-no-files-found: ignore

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run .NET Security Scanner
        continue-on-error: true
        run: |
          dotnet tool install --global security-scan
          dotnet security-scan Backend/src/CrmApi/CrmApi.csproj

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check NuGet vulnerabilities
        run: dotnet list Backend/src/CrmApi/CrmApi.csproj package --vulnerable

      - name: Check npm vulnerabilities
        run: |
          cd frontend
          npm audit --audit-level=high
