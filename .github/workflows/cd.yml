name: CD Deploy to Render

"on":
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'feature/khaled' || github.event.workflow_run.head_branch == 'feature/khaled1')) }}

    steps:
      - name: Trigger backend deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_BACKEND != '' }}
        env:
          RENDER_DEPLOY_HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          echo "Triggering backend deployment on Render..."
          curl -sf -X POST "$RENDER_DEPLOY_HOOK_BACKEND"

      - name: Trigger frontend deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_FRONTEND != '' }}
        env:
          RENDER_DEPLOY_HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          echo "Triggering frontend deployment on Render..."
          curl -sf -X POST "$RENDER_DEPLOY_HOOK_FRONTEND"

      - name: Fail if no deploy hooks configured
        if: ${{ env.RENDER_DEPLOY_HOOK_BACKEND == '' && env.RENDER_DEPLOY_HOOK_FRONTEND == '' }}
        env:
          RENDER_DEPLOY_HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          RENDER_DEPLOY_HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          echo "::error::Aucun deploy hook Render configure. Ajoutez les secrets GitHub RENDER_DEPLOY_HOOK_BACKEND et/ou RENDER_DEPLOY_HOOK_FRONTEND."
          exit 1
